[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "johnsonhei-retrieval_funnel_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测红队与内容安全工程师·检索召回的漏斗分析相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "johnsonhei" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://johnsonhei.github.io"
Repository = "https://github.com/johnsonhei/retrieval_funnel_consistency_check"
Issues = "https://github.com/johnsonhei/retrieval_funnel_consistency_check/issues"

[project.scripts]
retrieval_funnel_consistency_check = "retrieval_funnel_consistency_check:main"

[tool.setuptools]
py-modules = ["retrieval_funnel_consistency_check"]
